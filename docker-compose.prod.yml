# ============================================================================
# 999 PRO — Docker Compose for production
# v25.0-audit-fix: file-based Docker secrets (works on non-Swarm Docker),
#   Bun-based builds, simplified backend CMD, clear env-var contract.
#
# Services:
#   - postgres (PostgreSQL 16) on :5432
#   - backend  (Express + Prisma + Socket.IO) on :4000
#   - frontend (Next.js) on :3000
#   - studio   (Next.js admin) on :3001
#   - caddy    (reverse proxy with auto TLS) on :80/:443
#
# Usage:
#   1. Generate secrets + .env.prod:
#        ./generate-env.sh > .env.prod
#        ./generate-env.sh --secrets   # creates ./secrets/postgres_password.txt
#   2. Edit .env.prod (set APP_DOMAIN, SMTP_*, etc.)
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Required env vars (must be in .env.prod or shell env):
#   POSTGRES_PASSWORD (REQUIRED — fail-fast if missing)
#   JWT_SECRET, FIRST_RUN_TOKEN, RESET_ADMIN_TOKEN, IP_HASH_PEPPER
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
#   APP_PUBLIC_URL, APP_DOMAIN
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM (if email verify on)
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: 999pro-postgres
    restart: unless-stopped
    # File-based Docker secret: password read from /run/secrets/postgres_password
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=pro999
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    secrets:
      - source: postgres_password
        target: postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pro999"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - 999pro-net

  backend:
    build:
      context: ./mini-services/backend
      dockerfile: Dockerfile
    container_name: 999pro-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - FIRST_RUN_TOKEN=${FIRST_RUN_TOKEN:?FIRST_RUN_TOKEN is required}
      - RESET_ADMIN_TOKEN=${RESET_ADMIN_TOKEN:?RESET_ADMIN_TOKEN is required}
      - IP_HASH_PEPPER=${IP_HASH_PEPPER:?IP_HASH_PEPPER is required}
      - VAPID_SUBJECT=${VAPID_SUBJECT:?VAPID_SUBJECT is required}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY is required}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY is required}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-https://${APP_DOMAIN:-999.pro},https://studio.${APP_DOMAIN:-999.pro}}
      - TRUST_PROXY=true
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-true}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@${APP_DOMAIN:-999.pro}}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=pro999
      # PG_PASSWORD env var is set by the entrypoint wrapper below, read from
      # /run/secrets/postgres_password. We then assemble BACKEND_DATABASE_URL
      # at runtime so the password never lands in the container environment.
    secrets:
      - source: postgres_password
        target: postgres_password
    # Step 1: read Postgres password from Docker secret file.
    # Step 2: assemble BACKEND_DATABASE_URL inline (only in process env, NOT in
    #         container metadata — `docker inspect` shows the secret file path,
    #         not the password value).
    # Step 3: apply Prisma migrations (idempotent).
    # Step 4: start backend.
    command:
      - sh
      - -c
      - |
        PG_PASSWORD="$$(cat /run/secrets/postgres_password)" \
        BACKEND_DATABASE_URL="postgresql://postgres:$${PG_PASSWORD}@postgres:5432/pro999?schema=public" \
        bunx prisma migrate deploy && \
        PG_PASSWORD="$$(cat /run/secrets/postgres_password)" \
        BACKEND_DATABASE_URL="postgresql://postgres:$${PG_PASSWORD}@postgres:5432/pro999?schema=public" \
        node dist/index.js
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - 999pro-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 999pro-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://backend:4000
      - NEXT_PUBLIC_API_BASE=
      - NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
      - NEXT_TELEMETRY_DISABLED=1
      - ALLOW_IFRAME=false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - 999pro-net

  studio:
    build:
      # Root context so the studio Dockerfile can COPY packages/shared
      context: .
      dockerfile: mini-services/studio/Dockerfile
    container_name: 999pro-studio
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://backend:4000
      - NEXT_PUBLIC_API_BASE=
      - NEXT_PUBLIC_APP_URL=${APP_PUBLIC_URL:-https://${APP_DOMAIN:-999.pro}}
      - NEXT_PUBLIC_BACKEND_ORIGIN=http://backend:4000
      - NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
      - ALLOW_IFRAME=true
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/studio', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - 999pro-net

  caddy:
    image: caddy:2-alpine
    container_name: 999pro-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-999.pro}
      - STUDIO_DOMAIN=studio.${APP_DOMAIN:-999.pro}
    depends_on:
      - frontend
      - studio
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    networks:
      - 999pro-net

volumes:
  postgres-data:
  backend-uploads:
  caddy-data:
  caddy-config:

# File-based Docker secrets — work on non-Swarm Docker Engine.
# `./secrets/postgres_password.txt` is created by ./generate-env.sh --secrets
# or manually: `openssl rand -hex 24 > ./secrets/postgres_password.txt`
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

networks:
  999pro-net:
    driver: bridge
