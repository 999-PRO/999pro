# ============================================================================
# 999 PRO — Nginx reverse proxy config for https://tri-999.online
# ----------------------------------------------------------------------------
# This config routes traffic to the 3 backend services:
#   - Frontend (Next.js)       → http://127.0.0.1:3000
#   - Studio (Next.js)         → http://127.0.0.1:3001
#   - Backend (Express + WS)   → http://127.0.0.1:4000
#
# INSTALL:
#   1. sudo cp deploy/nginx.conf /etc/nginx/sites-available/tri-999.online
#   2. sudo ln -s /etc/nginx/sites-available/tri-999.online /etc/nginx/sites-enabled/
#   3. sudo certbot --nginx -d tri-999.online -d www.tri-999.online
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# REQUIREMENTS:
#   - nginx with http_ssl_module, http_v2_module, http_websocket_module
#   - certbot (Let's Encrypt) for SSL
#   - All 3 services running (npm run services:start)
# ============================================================================

# Rate limiting zones (defined at http level — move outside server block)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Upstreams (localhost — services bind to 127.0.0.1)
upstream ninepro_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}
upstream ninepro_studio {
    server 127.0.0.1:3001;
    keepalive 32;
}
upstream ninepro_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name tri-999.online www.tri-999.online;

    # ACME challenge passthrough for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tri-999.online www.tri-999.online;

    # SSL (paths filled by certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/tri-999.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tri-999.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Client body size (file uploads — products, avatars, chat attachments)
    client_max_body_size 50M;

    # ─── Socket.IO — MUST be before /api/ and /uploads/ rules ─────────────
    # WebSocket upgrade is critical for real-time chat + call signaling.
    location /socket.io/ {
        proxy_pass http://ninepro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60000;
        proxy_send_timeout 60000;
        # Buffering off for real-time
        proxy_buffering off;
    }

    # ─── Backend API ─────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://ninepro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ─── Auth endpoints — stricter rate limit (brute-force protection) ──
    location ~ ^/api/auth/(login|register|verify-email|send-verification|reset-password) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://ninepro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Static uploads (product images, avatars) ────────────────────────
    location /uploads/ {
        proxy_pass http://ninepro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cache static uploads for 7 days
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ─── Studio admin panel ──────────────────────────────────────────────
    # /studio/* → studio service (port 3001)
    # IMPORTANT: Studio's next.config.ts has basePath: "/studio" + assetPrefix: "/studio/"
    # so all its internal URLs already start with /studio/.
    location /studio {
        proxy_pass http://ninepro_studio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /studio/ {
        proxy_pass http://ninepro_studio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Studio's internal /studio/api/* and /studio/socket.io/* ─────────
    # These are rewritten by Studio's next.config.ts to the backend.
    # We proxy them to the studio service which then rewrites to the backend.
    # (Alternatively, you can proxy directly to the backend — but then the
    #  studio's basePath logic would break. Letting studio handle the rewrite
    #  is cleaner.)
    location /studio/api/ {
        proxy_pass http://ninepro_studio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /studio/socket.io/ {
        proxy_pass http://ninepro_studio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60000;
        proxy_send_timeout 60000;
        proxy_buffering off;
    }

    # ─── Frontend (Next.js) — everything else ────────────────────────────
    location / {
        proxy_pass http://ninepro_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ─── Next.js static assets — long cache ──────────────────────────────
    location /_next/static/ {
        proxy_pass http://ninepro_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ─── Service Worker — NEVER cache (must always be fresh) ─────────────
    location = /sw.js {
        proxy_pass http://ninepro_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /manifest.webmanifest {
        proxy_pass http://ninepro_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ─── OG image proxy (Sharp-encoded product images for WhatsApp/Telegram) ─
    location /og/ {
        proxy_pass http://ninepro_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 24h;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ─── PWA icons — long cache ──────────────────────────────────────────
    location /icons/ {
        proxy_pass http://ninepro_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }
}
