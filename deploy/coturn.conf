# ============================================================
# 999 PRO — Coturn TURN server configuration
# ============================================================
# Deploy on a dedicated server (or same host as backend) behind a firewall.
#
# Install:
#   sudo apt install coturn
#   sudo cp deploy/coturn.conf /etc/turnserver.conf
#   sudo systemctl enable coturn && sudo systemctl start coturn
#
# Open these ports on the firewall:
#   3478/tcp   — TURN listening (control)
#   3478/udp   — TURN listening (media relay)
#   5349/tcp   — TURNS (TLS) — optional, recommended
#   5349/udp   — TURNS (DTLS) — optional
#   49152-65535/udp — relay port range (must match below)
#
# Generate a strong static-auth-secret for production:
#   openssl rand -hex 32
# ============================================================

# Listener
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Relay port range (must be open on firewall)
min-port=49152
max-port=65535

# ====== AUTHENTICATION ======
# Mode 1 (simple): static long-term credentials.
# Set TURN_USERNAME and TURN_CREDENTIAL in backend .env to match.
user=999pro:CHANGE_ME_STRONG_PASSWORD_HERE
# OR mode 2 (recommended): use-auth-secret with time-limited tokens.
# use-auth-secret
# static-auth-secret=CHANGE_ME_RANDOM_32_HEX
#
# To enable mode 2, the backend /api/calls/ice-servers endpoint must sign
# short-lived HMAC credentials. See the TODO in routes/calls.ts.

# Realm — must match the domain users connect to.
# v25.5: use tri-999.online (the actual production domain). If you deploy
# under a different domain, update this to match.
realm=tri-999.online
server-name=tri-999.online

# Logging
log-file=/var/log/turnserver.log
simple-log
verbose

# Security
no-cli
no-tcp-relay
no-multicast-peers
no-loopback-peers
# Prevent TURN server from being abused as an open relay:
# only allow peers from RFC1918 + the server's own public IP.
# (Tighten further for production: only allow known peer IPs.)
no-tlsv1
no-tlsv1_1
fingerprint
stale-nonce=600

# TLS — provide your own certs (Let's Encrypt or commercial).
# v25.5: use tri-999.online domain for the TURN TLS cert.
# cert=/etc/letsencrypt/live/turn.tri-999.online/cert.pem
# pkey=/etc/letsencrypt/live/turn.tri-999.online/privkey.pem

# Performance
# Each relayed call uses ~100 Kbps audio / 1-2 Mbps video.
# Total concurrent calls ≈ (bandwidth / 2) per call.
# Example: 1 Gbps NIC → ~500 concurrent video calls.
total-quota=200
bps-capacity=0
