<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>999 — Три девятки · офлайн</title>
    <style>
      /* v9-audit-fix (M-4): use the app's dark theme color (#0f172a slate-900)
         instead of a bright blue gradient that clashes with the dark UI the
         user just came from. */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border-radius: 28px;
        padding: 2.5rem 1.5rem;
        max-width: 24rem;
        text-align: center;
        box-shadow: 0 12px 32px -10px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .emoji { font-size: 3rem; margin-bottom: 0.5rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; font-weight: 700; }
      p { font-size: 0.875rem; margin: 0 0 1.5rem; opacity: 0.85; line-height: 1.5; }
      .actions { display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
      button, a.btn {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        border: none;
        padding: 0.85rem 1.75rem;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
        transition: transform 0.15s, opacity 0.15s;
        text-decoration: none;
        display: inline-block;
        min-width: 12rem;
      }
      button:hover, a.btn:hover { transform: scale(1.02); }
      button:active, a.btn:active { transform: scale(0.97); }
      a.btn-secondary {
        background: transparent;
        color: #94a3b8;
        border: 1px solid rgba(148, 163, 184, 0.25);
      }
      .status { font-size: 0.75rem; opacity: 0.6; margin-top: 1rem; }
      .status.online { color: #4ade80; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">📡</div>
      <h1>Нет подключения</h1>
      <p>Похоже, вы офлайн. Проверьте интернет-соединение — мы автоматически обновим страницу, как только связь вернётся.</p>
      <div class="actions">
        <button onclick="location.reload()">Повторить</button>
        <a class="btn btn-secondary" href="/">На главную</a>
      </div>
      <div id="status" class="status">Ожидание сети…</div>
    </div>
    <script>
      // v9-audit-fix (M-5): auto-recover when network returns.
      (function () {
        var statusEl = document.getElementById('status');
        function updateStatus() {
          if (navigator.onLine) {
            statusEl.textContent = 'Сеть восстановлена — обновляем…';
            statusEl.classList.add('online');
            // Brief delay so the user sees the confirmation before reload.
            setTimeout(function () { location.reload(); }, 400);
          } else {
            statusEl.textContent = 'Ожидание сети…';
            statusEl.classList.remove('online');
          }
        }
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
      })();
    </script>
  </body>
</html>
