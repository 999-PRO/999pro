# ============================================================================
# 999 PRO — CI/CD Pipeline
# Wave 2 (C-CI-001): lint + typecheck + build on every PR
# H13+H14 fix: removed `continue-on-error: true` (was masking 644 warnings),
# pinned bun version, added backend Postgres service + smoke tests.
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Frontend (Next.js main app) ──────────────────────────────────────────
  frontend:
    name: Frontend — Lint + TypeCheck + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: TypeCheck
        run: bunx tsc --noEmit

      - name: Unit tests (Wave 4 / C-CI-002)
        run: bun run test

      - name: Build
        run: bun run build
        env:
          BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_API_BASE: http://localhost:4000

  # ─── Backend (Express + Prisma) ───────────────────────────────────────────
  backend:
    name: Backend — Lint + TypeCheck + Prisma + Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-services/backend

    # H14 fix: поднимаем Postgres 16 как service контейнер, чтобы
    # валидировать миграции + schema против реальной БД в CI.
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: pro999_test
        ports:
          - 5432:5432
        # Healthcheck — ждём пока Postgres будет готов принимать соединения
        options: >-
          --health-cmd "pg_isready -U postgres -d pro999_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Используем postgres provider для CI — валидируем реальную миграцию
      DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/pro999_test?schema=public
      BACKEND_DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/pro999_test?schema=public
      JWT_SECRET: ci_test_jwt_secret_min_32_chars_long_for_validation_only
      FIRST_RUN_TOKEN: ci_test_first_run_token_min_32_chars_long_xxxxxx
      RESET_ADMIN_TOKEN: ci_test_reset_admin_token_min_32_chars_long_xxxxx
      IP_HASH_PEPPER: ci_test_ip_hash_pepper_min_32_chars_long_xxxxxxxx
      VAPID_PUBLIC_KEY: BTest_test_test_test_test_test_test_test_test_test
      VAPID_PRIVATE_KEY: Test_test_test_test_test_test_test_test_test
      VAPID_SUBJECT: mailto:test@999.pro
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (SQLite schema)
        run: bunx prisma generate

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Push schema to Postgres (validates schema is in sync)
        run: bunx prisma db push --skip-generate --accept-data-loss

      - name: TypeCheck
        run: bunx tsc --noEmit

      - name: Build
        run: bunx tsc

      - name: Smoke test — start backend + check health endpoint
        run: |
          # Start backend in background
          PORT=4001 node dist/index.js &
          BACKEND_PID=$!
          # Wait for startup (max 20s)
          for i in {1..20}; do
            if curl -sf http://localhost:4001/api/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              curl -s http://localhost:4001/api/health
              kill $BACKEND_PID
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          kill $BACKEND_PID 2>/dev/null || true
          exit 1

  # ─── Studio (Next.js admin panel) ─────────────────────────────────────────
  studio:
    name: Studio — Lint + TypeCheck + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-services/studio
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: TypeCheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
        env:
          BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_API_BASE: http://localhost:4000

  # ─── Secret scanning ──────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for scanning all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # only needed for orgs

  # ─── Docker build smoke test ──────────────────────────────────────────────
  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [frontend, backend, studio]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./mini-services/backend
          push: false
          tags: 999pro-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: 999pro-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build studio image
        uses: docker/build-push-action@v5
        with:
          context: ./mini-services/studio
          push: false
          tags: 999pro-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
